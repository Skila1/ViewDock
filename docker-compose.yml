# Development Compose. Production hosts should use install.sh, then
# docker compose pull && docker compose up -d (ghcr.io/skila1/viewdock:latest).
services:
  viewdock:
    image: ghcr.io/skila1/viewdock:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: viewdock
    ports:
      - "${VD_PORT:-8080}:8080"
    environment:
      VD_HTTP_ADDR: ":8080"
      VD_CONFIG_DIR: /config
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_PUBLIC_URL: ${VD_PUBLIC_URL:-}
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./transcode:/transcode
      - ./media:/media
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
