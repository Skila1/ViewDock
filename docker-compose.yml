# GPU is selected from .env (VD_GPU=true|false). Compose profiles follow that flag:
#   VD_GPU=false  →  COMPOSE_PROFILES=cpu
#   VD_GPU=true   →  COMPOSE_PROFILES=gpu
# The installer keeps those in sync. CPU hosts never request an NVIDIA device.
# Same image for both. NVIDIA Container Toolkit is required when VD_GPU=true.
#
# Optional distributed profile: set COMPOSE_PROFILES=cpu,postgres,minio (or gpu,postgres,minio)
# and set VD_DATABASE_DRIVER=postgres / VD_DATABASE_URL=postgres://viewdock:secret@postgres:5432/viewdock
# together with the MinIO storage variables if you want object storage enabled.
#
# Mesh profile (COMPOSE_PROFILES=mesh): a control plane plus two media workers on
# PostgreSQL. Start it, register viewdock-worker-1 and viewdock-worker-2 (port 8080,
# http) under Admin, Nodes, issue a credential for each, put the secrets in .env as
# VD_NODE_SECRET_1 and VD_NODE_SECRET_2, then `docker compose up -d` again. Workers
# refuse to start without a secret.
name: viewdock

x-viewdock: &viewdock
  image: ${VD_IMAGE:-ghcr.io/skila1/viewdock:latest}
  container_name: viewdock
  restart: ${VD_RESTART:-unless-stopped}
  stop_grace_period: 60s
  env_file: [.env]
  environment:
    VD_HTTP_ADDR: ":8080"
    VD_CONFIG_DIR: /config
    VD_CACHE_DIR: /cache
    VD_TRANSCODE_DIR: /transcode
    VD_MEDIA_DIR: /media
    VD_COMPOSE_PROJECT: viewdock
    VD_UPDATE_DIR: /update
    VD_DATABASE_DRIVER: ${VD_DATABASE_DRIVER:-sqlite}
    VD_DATABASE_URL: ${VD_DATABASE_URL:-}
    VD_STORAGE_DRIVER: ${VD_STORAGE_DRIVER:-local}
    VD_STORAGE_ENDPOINT: ${VD_STORAGE_ENDPOINT:-}
    VD_STORAGE_BUCKET: ${VD_STORAGE_BUCKET:-viewdock}
    VD_STORAGE_ACCESS_KEY: ${VD_STORAGE_ACCESS_KEY:-}
    VD_STORAGE_SECRET_KEY: ${VD_STORAGE_SECRET_KEY:-}
    VD_STORAGE_USE_SSL: ${VD_STORAGE_USE_SSL:-false}
  group_add:
    - "991"
  volumes:
    - ./config:/config
    - ./cache:/cache
    - ./transcode:/transcode
    - ./media:/media
    - ./update:/update
    - /var/run/docker.sock:/var/run/docker.sock
  ports:
    - "${VD_PORT:-8080}:8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 8
    start_period: 25s

x-viewdock-worker: &viewdock-worker
  image: ${VD_IMAGE:-ghcr.io/skila1/viewdock:latest}
  restart: ${VD_RESTART:-unless-stopped}
  stop_grace_period: 60s
  profiles: ["mesh"]
  group_add:
    - "991"
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 5s
    retries: 8
    start_period: 25s

volumes:
  postgres_data:
  minio_data:
  worker1_cache:
  worker1_transcode:
  worker2_cache:
  worker2_transcode:

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres", "distributed", "mesh"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${VD_POSTGRES_USER:-viewdock}
      POSTGRES_PASSWORD: ${VD_POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${VD_POSTGRES_DB:-viewdock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${VD_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VD_POSTGRES_USER:-viewdock} -d ${VD_POSTGRES_DB:-viewdock}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/bitnamilegacy/minio:latest
    user: "0:0"
    profiles: ["minio", "distributed"]
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${VD_S3_ACCESS_KEY:-viewdock}
      MINIO_ROOT_PASSWORD: ${VD_S3_SECRET_KEY:-viewdock-secret}
    volumes:
      - minio_data:/data
    ports:
      - "${VD_S3_PORT:-9000}:9000"
      - "${VD_S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  viewdock:
    <<: *viewdock
    profiles: ["cpu"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false

  viewdock-gpu:
    <<: *viewdock
    profiles: ["gpu"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
    gpus: all
    environment:
      VD_HTTP_ADDR: ":8080"
      VD_CONFIG_DIR: /config
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_COMPOSE_PROJECT: viewdock
      VD_UPDATE_DIR: /update
      VD_DATABASE_DRIVER: ${VD_DATABASE_DRIVER:-sqlite}
      VD_DATABASE_URL: ${VD_DATABASE_URL:-}
      VD_STORAGE_DRIVER: ${VD_STORAGE_DRIVER:-local}
      VD_STORAGE_ENDPOINT: ${VD_STORAGE_ENDPOINT:-}
      VD_STORAGE_BUCKET: ${VD_STORAGE_BUCKET:-viewdock}
      VD_STORAGE_ACCESS_KEY: ${VD_STORAGE_ACCESS_KEY:-}
      VD_STORAGE_SECRET_KEY: ${VD_STORAGE_SECRET_KEY:-}
      VD_STORAGE_USE_SSL: ${VD_STORAGE_USE_SSL:-false}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility

  viewdock-distributed:
    <<: *viewdock
    container_name: viewdock-distributed
    profiles: ["distributed"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      VD_HTTP_ADDR: ":8080"
      VD_CONFIG_DIR: /config
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_COMPOSE_PROJECT: viewdock
      VD_UPDATE_DIR: /update
      VD_DATABASE_DRIVER: postgres
      VD_DATABASE_URL: ${VD_DATABASE_URL:-postgres://viewdock:secret@postgres:5432/viewdock?sslmode=disable}
      VD_STORAGE_DRIVER: s3
      VD_STORAGE_ENDPOINT: ${VD_STORAGE_ENDPOINT:-minio:9000}
      VD_STORAGE_BUCKET: ${VD_STORAGE_BUCKET:-viewdock}
      VD_STORAGE_ACCESS_KEY: ${VD_STORAGE_ACCESS_KEY:-viewdock}
      VD_STORAGE_SECRET_KEY: ${VD_STORAGE_SECRET_KEY:-viewdock-secret}
      VD_STORAGE_USE_SSL: ${VD_STORAGE_USE_SSL:-false}

  viewdock-control:
    <<: *viewdock
    container_name: viewdock-control
    profiles: ["mesh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VD_ROLE: control
      VD_HTTP_ADDR: ":8080"
      VD_CONFIG_DIR: /config
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_COMPOSE_PROJECT: viewdock
      VD_UPDATE_DIR: /update
      VD_DATABASE_DRIVER: postgres
      VD_DATABASE_URL: ${VD_DATABASE_URL:-postgres://viewdock:secret@postgres:5432/viewdock?sslmode=disable}

  viewdock-worker-1:
    <<: *viewdock-worker
    container_name: viewdock-worker-1
    environment:
      VD_ROLE: worker
      VD_NODE_SECRET: ${VD_NODE_SECRET_1:-}
      VD_HTTP_ADDR: ":8080"
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_DATABASE_DRIVER: postgres
      VD_DATABASE_URL: ${VD_DATABASE_URL:-postgres://viewdock:secret@postgres:5432/viewdock?sslmode=disable}
    volumes:
      - ./media:/media
      - worker1_cache:/cache
      - worker1_transcode:/transcode

  viewdock-worker-2:
    <<: *viewdock-worker
    container_name: viewdock-worker-2
    environment:
      VD_ROLE: worker
      VD_NODE_SECRET: ${VD_NODE_SECRET_2:-}
      VD_HTTP_ADDR: ":8080"
      VD_CACHE_DIR: /cache
      VD_TRANSCODE_DIR: /transcode
      VD_MEDIA_DIR: /media
      VD_DATABASE_DRIVER: postgres
      VD_DATABASE_URL: ${VD_DATABASE_URL:-postgres://viewdock:secret@postgres:5432/viewdock?sslmode=disable}
    volumes:
      - ./media:/media
      - worker2_cache:/cache
      - worker2_transcode:/transcode

  # Independently hosted web frontend. It serves the app shell with no
  # database access and relays API traffic to the control plane, so the shell
  # stays reachable while the control plane or a worker is down. Publish this
  # port (or put it behind your reverse proxy) as the public address.
  viewdock-frontend:
    image: ${VD_IMAGE:-ghcr.io/skila1/viewdock:latest}
    container_name: viewdock-frontend
    restart: ${VD_RESTART:-unless-stopped}
    profiles: ["mesh"]
    environment:
      VD_ROLE: frontend
      VD_HTTP_ADDR: ":8080"
      VD_CONTROL_URL: ${VD_CONTROL_URL:-http://viewdock-control:8080}
    ports:
      - "${VD_FRONTEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  # Separately deployed watch party coordinator (COMPOSE_PROFILES=mesh,coordinator).
  # Put VD_COORDINATOR_SECRET (at least 32 characters) and
  # VD_COORDINATOR_URL=http://viewdock-coordinator:8080 in .env; the control
  # plane then relays watch parties here. Rooms are stored in PostgreSQL and
  # survive restarts of either process.
  viewdock-coordinator:
    image: ${VD_IMAGE:-ghcr.io/skila1/viewdock:latest}
    container_name: viewdock-coordinator
    restart: ${VD_RESTART:-unless-stopped}
    stop_grace_period: 30s
    profiles: ["coordinator"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VD_ROLE: coordinator
      VD_HTTP_ADDR: ":8080"
      VD_CONFIG_DIR: /config
      VD_DATABASE_DRIVER: postgres
      VD_DATABASE_URL: ${VD_DATABASE_URL:-postgres://viewdock:secret@postgres:5432/viewdock?sslmode=disable}
      VD_COORDINATOR_SECRET: ${VD_COORDINATOR_SECRET:-}
    volumes:
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
