# Optional NVIDIA overlay. Same :latest image as docker-compose.yml.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Or set COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml in .env
services:
  viewdock:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    gpus: all
