# Local-only overlay. Does not pull GHCR. No gpus here — add the GPU overlay explicitly.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.local.yml up -d --build
services:
  viewdock:
    image: viewdock:local
    container_name: viewdock-local
    environment:
      VD_PUBLIC_URL: ${VD_PUBLIC_URL:-http://127.0.0.1:8080}
      VD_HWACCEL: ${VD_HWACCEL:-off}
    restart: "no"
