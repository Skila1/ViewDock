<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'" />
    <title>ViewDock</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="icon.png" alt="" />
        <h1>Connect to ViewDock</h1>
      </div>
      <p>Enter the address of your ViewDock server, the one you open in your browser.</p>
      <form id="form">
        <label for="server">Server address</label>
        <input id="server" type="text" autocomplete="url" spellcheck="false" placeholder="https://viewdock.example.com" required />
        <div class="row">
          <button id="connect" class="primary" type="submit">Connect</button>
        </div>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
