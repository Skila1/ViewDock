# Builds the MkDocs site from docs/ and publishes it to GitHub Pages at
# https://wiki.viewdock.dev (docs/CNAME). Pull requests only build, so broken
# links fail before merge. Runs on github.com only, like docker.yml.
#
# The privacy check runs on the sources before the build and on the built
# site, its assets and search index after it; deploy only runs when both
# pass.
#
# Repository setting: Settings, Pages, Source "GitHub Actions". Branch
# publishing must stay off, or GitHub's Jekyll build overwrites this site.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs_privacy_check.py"
      - "scripts/test_docs_privacy_check.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/docs_privacy_check.py"
      - "scripts/test_docs_privacy_check.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Scanner tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Privacy check (sources)
        run: python scripts/docs_privacy_check.py
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - name: Privacy check (built site)
        run: python scripts/docs_privacy_check.py --site site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.server_url == 'https://github.com' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
